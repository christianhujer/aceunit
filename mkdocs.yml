site_name: AceUnit
site_description: Advanced C and Embedded Unit Test Framework
site_url: https://nelkinda.com/products/aceunit/
repo_url: https://github.com/christianhujer/aceunit
repo_name: christianhujer/aceunit
edit_uri: edit/trunk/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Concepts: concepts.md
    - Assertions: assertions.md
    - Runners:
      - Overview: runners/index.md
      - SimpleRunner: runners/simple.md
      - SetJmpRunner: runners/setjmp.md
      - AbortRunner: runners/abort.md
      - ForkRunner: runners/fork.md
    - Makefile Integration: makefile-integration.md
  - Reference:
    - CLI Reference: cli-reference.md
    - API Reference: api-reference.md
    - Platforms & Compilers: platforms.md
  - Examples:
    - Leap Year: examples/leapyear.md
    - Hello World: examples/hello-world.md
    - Cross-Compilation: cross-compilation.md
  - Migration Guide: migration-guide.md
  - FAQ: faq.md
  - Contributing: contributing.md
