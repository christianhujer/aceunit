name: C CI for clang on Mac OS

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: make using zsh instead of bash
      run: |
        LLVM_FORMULA=$(brew list --formula | grep '^llvm' | head -n 1)
        LLVM_PATH=$(brew --prefix $LLVM_FORMULA)/bin
        export PATH="$LLVM_PATH:$PATH"
        ./configure.sh && make CC=clang
