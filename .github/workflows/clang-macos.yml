name: C CI for clang on Mac OS

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6.0.2
    - name: make using zsh instead of bash
      run: ./configure.sh && PATH=/opt/homebrew/opt/llvm/bin:$PATH make CC=clang
